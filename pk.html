 function switchPage(pageId) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active');
    p.style.opacity = '0'; // 確保隱藏時透明
  });

}
function showModal(content, actions) {
  hideModal(); // 先移除現有模態框
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const modal = document.createElement('div');
  modal.className = 'modal-content';
  modal.style.opacity = '0'; // 初始透明
  modal.style.transition = 'opacity 0.3s ease-in-out'; // 添加過渡
  modal.innerHTML = `<div class="modal-body">${content}</div>`;
  
  if (Array.isArray(actions)) {
    const btnGroup = document.createElement('div');
    btnGroup.className = 'modal-buttons';
    actions.forEach(({ text, class: className, onClick }) => {
      const btn = document.createElement('button');
      btn.textContent = text;
      btn.className = className || '';
      btn.onclick = () => {
        hideModal();
        onClick && onClick();
      };
      btnGroup.appendChild(btn);
    });
    modal.appendChild(btnGroup);
  } else if (typeof actions === 'function') {
    const input = modal.querySelector('input[type="text"]');
    if (input) input.focus();
    const btn = modal.querySelector('button');
    if (btn) {
      btn.onclick = () => actions(input ? input.value.trim() : '');
    }
    input && input.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        actions(input.value.trim());
      }
    });
  }

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
  setTimeout(() => {
    modal.style.opacity = '1'; // 淡入效果
  }, 10); // 短暫延遲
}

function hideModal() {
  console.log('🔥 hideModal() 被呼叫');

  document.getElementById('pk-enter-btn').addEventListener('click', async () => {

  const roomRef = db.ref(`rooms/${code}`);
  try {

      const roomData = snap.val();
      const lastActivity = roomData.lastActivity || roomData.createdAt || Date.now();
      // 檢查參與者數量
      const participantCount = roomData.participants ? Object.keys(roomData.participants).length : 0;

      // 檢查房間是否過期
      if (Date.now() - lastActivity > 600000) { // 10 分鐘
        await roomRef.remove(); // 刪除過期房間
        alert('該房間已過期，將創建新房間');
        // 創建新房間
        await roomRef.set({

          pkHelper: { status: 'pending', games: [], results: [] }
        });

function drawAngleQuestionCanvas($wrap, angleDeg) {
  // 清空內容
  $wrap.innerHTML = "";

  // 最大寬度自適應，建議最大350px
  const width = Math.min($wrap.offsetWidth || 320, 350);

  // 主半徑、位置參數
  const r = width * 0.39;        // 半徑
  const arcPad = 10;             // 弧線外推邊界
  const circPad = 10;            // 圓心外推邊界
  const linePad = 12;            // 角度線端點外推邊界
  const strokeW = 2;             // 主線寬

  // 圓心座標（置中）
  const cx = width / 2;

  // 計算最上方 & 最下方 y
  // 水平線底在 0度/180度時與圓心等高
  const rad = angleDeg * Math.PI / 180;
  // 角度線端點
  const x2 = cx + Math.cos(rad) * r;
  const y2 = Math.round(circPad + r - Math.sin(rad) * r);

  // 圓心cy設計在圖片中較高一點, 但又不能切掉最上面
  // 找弧線最上方點
  const arcR = r * 0.75;
  // 橘弧的最高點
  const arcY1 = circPad + r - Math.sin(rad) * arcR;
  const arcY2 = circPad + r - Math.sin(0) * arcR; // 水平
  const minY = Math.min(arcY1, arcY2, y2, circPad); // 上
  const maxY = Math.max(arcY1, arcY2, y2, circPad + r); // 下

  // 真正高度（加上一些微padding，避免陰影切邊）
  const height = Math.ceil(maxY - minY + arcPad * 2 + strokeW);

  // 重新計算cy（圓心y在畫布中相對位置）
  const cy = circPad + r - minY + arcPad;

  // 建立Canvas
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  $wrap.appendChild(canvas);

  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,width,height);

  // 主色
  const blue = "#1677FF", orange = "#FFA63C", red = "#ff7577";

  // -- 底部水平線（藍漸層） --
  let grad = ctx.createLinearGradient(cx, cy, cx + r, cy);
  grad.addColorStop(0, blue);
  grad.addColorStop(1, "#3DC7FF");
  ctx.save();
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + r, cy);
  ctx.stroke();
  ctx.restore();

  // -- 圓心 --
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.shadowColor = blue;
  ctx.shadowBlur = 6;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fillStyle = orange;
  ctx.shadowBlur = 0;
  ctx.fill();
  ctx.restore();

  // -- 角度線 --
  ctx.save();
  ctx.strokeStyle = red;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(
    cx + Math.cos(rad) * r,
    cy - Math.sin(rad) * r
  );
  ctx.stroke();
  ctx.restore();

  // -- 角度線端圓點 --
  const ex = cx + Math.cos(rad) * r;
  const ey = cy - Math.sin(rad) * r;
  ctx.save();
  ctx.beginPath();
  ctx.arc(ex, ey, 7, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.shadowColor = red;
  ctx.shadowBlur = 7;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex, ey, 3.7, 0, Math.PI * 2);
  ctx.fillStyle = red;
  ctx.shadowBlur = 0;
  ctx.fill();
  ctx.restore();

  // -- 橘色弧線 --
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, arcR, 0, -rad, true);
  ctx.strokeStyle = orange;
  ctx.lineWidth = 2;
  ctx.shadowColor = orange;
  ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.restore();
}

// 這個函式每次進房都呼叫一次，保證一定有 answer
async function ensureUltimateNumAnswer(roomRef, myUid, playerNames) {
  const playersArr = Object.keys(playerNames).sort();
  let retry = 0;
  while (true) {
    let snap = await roomRef.child('ultimateNum').get();
    let val = snap.val();
    if (val && typeof val.answer === 'number') {
      // 已經有答案了，不用做事
      return;
    }
    // 沒有答案，由房主負責產生
    if (myUid === playersArr[0]) {
      let ans = Math.floor(Math.random() * 66) + 1;
      // 只設 answer，不覆蓋舊 log (如果房主失敗可重來)
      await roomRef.child('ultimateNum').update({ answer: ans, min: 1, max: 66, turn: 0, log: [] });
    }
    // 其它人稍等再檢查（有 answer 再進行）
    await new Promise(res => setTimeout(res, 200 + Math.random() * 100));
    retry++;
    if (retry > 30) throw new Error('房間超時無法產生答案');
  }
}

function startCamelAnimLoop() {
  const camel = document.getElementById('camel-emoji');
  if (!camel) return;
  let forward = true;
  function go() {
    camel.style.animation = 'none';
    void camel.offsetWidth; // reflow，讓動畫能重新觸發
    if (forward) {
      camel.style.transform = 'scaleX(-1)';
      camel.style.animation = 'camel-walk-right 3s linear forwards';
    } else {
      camel.style.transform = 'scaleX(1)';
      camel.style.animation = 'camel-walk-left 3s linear forwards';
    }
    forward = !forward;
  }
  camel.removeEventListener('animationend', go);
  camel.addEventListener('animationend', go);
  go();
}

async function renderTimeSenseGame(roomRef, myUid, playerNames) {

    // 其他人等待房主產生

      await new Promise(res => setTimeout(res, 100));

// 炸彈canvas動畫（你原本的即可）
function drawBombCanvas($wrap, remain, total, ended) {
  $wrap.innerHTML = '';
  const w = 550, h = 180;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  $wrap.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  // ===== 1. 畫「外框四周淡化」遮罩 =====
  // 四邊自然過渡淡化到透明
  // 下方(底部)漸層
  let gradBottom = ctx.createLinearGradient(0, h-36, 0, h);
  gradBottom.addColorStop(0, 'rgba(60,60,70,0)');
  gradBottom.addColorStop(1, 'rgba(40,40,40,0.32)');
  ctx.fillStyle = gradBottom;
  ctx.fillRect(0, h-36, w, 36);
  // 上方(頭頂)漸層
  let gradTop = ctx.createLinearGradient(0, 0, 0, 22);
  gradTop.addColorStop(0, 'rgba(60,60,70,0.16)');
  gradTop.addColorStop(1, 'rgba(60,60,70,0)');
  ctx.fillStyle = gradTop;
  ctx.fillRect(0, 0, w, 22);
  // 左右側淡化（加一點煙霧效果）
  let gradL = ctx.createLinearGradient(0, h/2, 21, h/2);
  gradL.addColorStop(0, 'rgba(40,40,40,0.20)');
  gradL.addColorStop(1, 'rgba(60,60,70,0)');
  ctx.fillStyle = gradL;
  ctx.fillRect(0, 0, 21, h);
  let gradR = ctx.createLinearGradient(w, h/2, w-21, h/2);
  gradR.addColorStop(0, 'rgba(40,40,40,0.20)');
  gradR.addColorStop(1, 'rgba(60,60,70,0)');
  ctx.fillStyle = gradR;
  ctx.fillRect(w-21, 0, 21, h);

  // ===== 2. 炸彈「在canvas中正中央」定位 =====
  // 調整中心點到適合的位置
  // 炸彈主體半徑 54，上面火花頂端約比球心高75px
  // h:160  → y中心設 86px，火花頂端大約會在 86-75=11px，不切邊
  // 底部則為 86+54=140px，不會碰到邊
  const cx = w/2, cy = 100; // y=86px 是最佳上下居中位置
  let dangerRatio = Math.max(0, 1 - remain/total);
  let bombColor = `rgb(${60+dangerRatio*195},${60-dangerRatio*30},${60-dangerRatio*80})`;
  let shake = dangerRatio > 0.72 ? Math.random()*6-3 : Math.random()*2-1;

  // ==== 畫炸彈 ====
  ctx.save();
  ctx.translate(cx + shake, cy + shake);

  // 爆炸時
  if (ended || remain <= 0.0009) {
    ctx.fillStyle = '#ff3636';
    ctx.beginPath();
    ctx.arc(0, 0, 54 + Math.random()*17, 0, Math.PI*2);
    ctx.fill();
    for (let i=0; i<17; i++) {
      ctx.save();
      ctx.rotate((i/17)*Math.PI*2 + Math.random());
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(54+Math.random()*27, 0);
      ctx.strokeStyle = ['#FFD24D','#FF8C42','#FF3333'][i%3];
      ctx.lineWidth = 5 + Math.random()*5;
      ctx.shadowColor = '#FFD24D';
      ctx.shadowBlur = 10 + Math.random()*20;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    return;
  }

  // 主體
  ctx.beginPath();
  ctx.arc(0, 0, 54, 0, Math.PI*2);
  ctx.fillStyle = bombColor;
  ctx.shadowColor = '#ff7979';
  ctx.shadowBlur = 13 + dangerRatio*27;
  ctx.fill();

  // 紅光
  if (dangerRatio > 0.55 && Math.floor(Date.now()/130)%2==0) {
    ctx.beginPath();
    ctx.arc(0, 0, 46 + Math.random()*13, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,24,24,0.22)';
    ctx.fill();
  }
  // 尾巴
  ctx.beginPath();
  ctx.moveTo(0, -54);
  ctx.lineTo(0, -70);
  ctx.strokeStyle='#FFD24D';
  ctx.lineWidth=6;
  ctx.stroke();
  // 火花
  ctx.beginPath();
  ctx.arc(0, -75, 8, 0, Math.PI*2);
  ctx.fillStyle=['#FFD24D','#FF8C42','#FF3333'][Math.floor(Math.random()*3)];
  ctx.shadowColor='#FFD24D';
  ctx.shadowBlur=8+dangerRatio*11;
  ctx.fill();
  // 臨爆黑X
  if (dangerRatio>0.94 && Math.floor(Date.now()/140)%2==0) {
    ctx.save();
    ctx.rotate(Math.random()*0.3-0.15);
    ctx.strokeStyle = '#1c1c1c';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(-29,-29); ctx.lineTo(29,29);
    ctx.moveTo(-29,29); ctx.lineTo(29,-29);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}


// 爆炸動畫
function bombExplodeAnim($wrap, cb) {
  let t = 0, anim = setInterval(() => {
    drawBombCanvas($wrap, 0, 10, true);
    t++;
    if (t>20) { clearInterval(anim); cb && cb(); }
  }, 35);
}

async function initGameFlow(roomRef) {

  roomRef.child('gameFlow/currentGame').once('value', snap => {
    cb(snap.val() ?? 0);

function startCurrentGame(roomRef, myUid, playerNames) {
  getCurrentGameIndex(roomRef, idx => {

    if (game === 'rps') renderRPSGame(roomRef, myUid, playerNames);
    else if (game === 'angle') renderAngleGame(roomRef, myUid, playerNames);
    else if (game === 'number') renderUltimateNumberGame(roomRef, myUid, playerNames);

    else if (game === 'bomb') renderBombGame(roomRef, myUid, playerNames);

  });

      document.getElementById('continue-no-btn').onclick = () => {
        hideModal();
        roomRef.child('gameFlow/forceEnd').set(true); // 💥 所有人會監聽這個跳 result
      };

      // ✅ 雙方都按「同意」→ 繼續遊戲
      roomRef.child('gameFlow/continueAll').on('value', snap2 => {
        const ans = snap2.val() || {};
        const vals = Object.values(ans);
        if (vals.length === 2 && vals.every(x => x === true)) {
          roomRef.child('gameFlow/continueAll').off(); // 停止監聽
          roomRef.child('gameFlow/forceEnd').off();   // 停止監聽
cb(); 
        }
      });

      // ✅ 任一人按「不同意」→ 所有人跳 resultPage
      roomRef.child('gameFlow/forceEnd').on('value', snap3 => {
        if (snap3.val() === true) {
          roomRef.child('gameFlow/forceEnd').off();
          roomRef.child('gameFlow/continueAll').off();
          hideModal();
          showResultPage(roomRef, playerNames);
        }
      });

      return;
    }

    // 若還沒三勝 → 繼續比賽
    cb();
  });
}

// 這是你要補在 function 區域的輔助方法
function waitForBothReadyNextStage(roomRef, myUid, cb) {
  const ref = roomRef.child('readyNextStage');
  function onReady(snap) {
    const ready = snap.val() || {};
    const readyCount = Object.values(ready).filter(Boolean).length;
    console.log('[debug] readyNextStage:', ready, 'count:', readyCount);
    if (readyCount >= 2) {
      ref.off('value', onReady);
      cb && cb();
      setTimeout(() => ref.remove(), 200); // 延遲移除，避免 race condition
    }
  }
  ref.on('value', onReady);
}

function updatePlayerNames(roomRef, myUid) {
  roomRef.child('participants').once('value').then(snap => {
    const participants = snap.val() || {};
    const playersArr = Object.keys(participants).sort(); // A、B 排序
    const name1 = participants[playersArr[0]]?.name || '玩家1';
    const name2 = participants[playersArr[1]]?.name || '玩家2';

    const el1 = document.getElementById('player1-name');
    const el2 = document.getElementById('player2-name');
    if (el1) el1.textContent = name1;
    if (el2) el2.textContent = name2;
  });
}
